name: Exercise existing Windows package
on:
  workflow_dispatch:
    inputs:
      package-run:
        description: Run ID containing the desktop-package-Windows artifact
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  CARGO_BUILD_JOBS: 3
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: package-windows-2025
          cache-on-failure: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-package-Windows
          path: downloaded-package
          run-id: ${{ inputs.package-run }}
          github-token: ${{ github.token }}
      - name: Prepare matching Microsoft runtime and driver
        shell: pwsh
        run: ./scripts/prepare-webview2.ps1 -WithDriver
      - name: Verify and install the existing package
        shell: pwsh
        run: |
          $manifest = Get-Content downloaded-package/build-info.json -Raw | ConvertFrom-Json
          $runtime = Get-Content scripts/webview2-runtime.json -Raw | ConvertFrom-Json
          if ($manifest.webview2.version -ne $runtime.version) { throw 'Package/runtime version mismatch.' }
          $installer = @(Get-ChildItem downloaded-package -Filter *.exe)
          if ($installer.Count -ne 1) { throw 'Expected one installer.' }
          $expected = (Get-Content downloaded-package/SHA256SUMS.txt).Split(' ')[0]
          if ((Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Package checksum mismatch.' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'kotoba-installed'
          $process = Start-Process $installer[0].FullName -ArgumentList '/S', "/D=$installRoot" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $application = Join-Path $installRoot 'kotoba-desktop.exe'
          if (!(Test-Path $application)) { throw 'Installed executable is missing.' }
          if (!(Test-Path (Join-Path $installRoot 'runtime/webview2/msedgewebview2.exe'))) { throw 'Bundled Fixed Version runtime is missing.' }
          "KOTOBA_TEST_APPLICATION=$application" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path artifacts/native -Force | Out-Null
          Copy-Item downloaded-package/build-info.json artifacts/native/package-build-info.json
          Copy-Item downloaded-package/SHA256SUMS.txt artifacts/native/package-SHA256SUMS.txt
      - name: Exercise the installed application
        timeout-minutes: 8
        run: node scripts/verify-native.mjs
      - name: Windows application failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'kotoba-desktop|msedgewebview2' } |
            Select-Object TimeCreated, ProviderName, Id, Message | Format-List
      - name: Upload synthetic native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-windows-evidence
          path: artifacts/native/
          retention-days: 14
