name: Build and exercise desktop packages
on: workflow_dispatch
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 3
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@ebb3d1676050bfd0971c36c1e215b5751473994d # 1.96.0
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: package-${{ matrix.os }}
          cache-on-failure: true
      - name: Linux desktop and test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf webkit2gtk-driver xvfb strace dbus-x11 fonts-noto-cjk
      - run: npm ci
      - name: Prepare pinned Windows runtime and test driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-webview2.ps1 -WithDriver
      - name: Build macOS APP and DMG
        if: runner.os == 'macOS'
        run: npm run package:macos
      - name: Validate DMG
        if: runner.os == 'macOS'
        run: hdiutil verify artifacts/*.dmg
      - name: Build Ubuntu DEB
        if: runner.os == 'Linux'
        run: npm run tauri -- build --bundles deb
      - name: Build Windows NSIS with Fixed Version WebView2
        if: runner.os == 'Windows'
        run: npm run tauri -- build --bundles nsis
      - name: Collect packages and checksums
        run: node scripts/collect-packages.mjs
      - name: Install Ubuntu package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y "$PWD"/artifacts/*.deb
          test -x /usr/bin/kotoba-desktop
          echo 'KOTOBA_TEST_APPLICATION=/usr/bin/kotoba-desktop' >> "$GITHUB_ENV"
      - name: Install Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem artifacts -Filter *.exe)
          if ($installers.Count -ne 1) { throw 'Expected one NSIS installer.' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'kotoba-installed'
          $installer = Start-Process $installers[0].FullName -ArgumentList '/S', "/D=$installRoot" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          $application = Join-Path $installRoot 'kotoba-desktop.exe'
          if (!(Test-Path $application)) { throw 'Installed executable is missing.' }
          if (!(Test-Path (Join-Path $installRoot 'runtime/webview2/msedgewebview2.exe'))) { throw 'Bundled Fixed Version runtime is missing.' }
          "KOTOBA_TEST_APPLICATION=$application" >> $env:GITHUB_ENV
      - name: Install native automation driver
        if: runner.os != 'macOS'
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Exercise installed Ubuntu app and observe network calls
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: xvfb-run -a dbus-run-session -- node scripts/verify-native.mjs
      - name: Exercise installed Windows app with bundled runtime
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: node scripts/verify-native.mjs
      - name: Upload private package and synthetic test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-package-${{ runner.os }}
          path: |
            artifacts/*.dmg
            artifacts/*.deb
            artifacts/*.exe
            artifacts/SHA256SUMS.txt
            artifacts/build-info.json
            artifacts/native/
          if-no-files-found: warn
          retention-days: 14
